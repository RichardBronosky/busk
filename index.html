<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tip Bruno</title>
<meta name="description" content="Enjoying the show? Tip Bruno with Venmo or Cash App.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="Tip Bruno">
<meta property="og:description" content="Enjoying the show? Tip with Venmo or Cash App.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1 class="name">Bruno Bronosky</h1>
    <p class="tagline">Enjoying the show? Tips are appreciated.</p>
  </header>

  <p class="prompt">Tap your app, or scan its code from another phone.</p>

  <div class="pay-grid">
    <a class="pay venmo" href="https://venmo.com/code?user_id=2940116783857664909&amp;created=1794525172&amp;printed=true">
      <span class="pay-head">
        <span class="pay-brand">Venmo</span>
        <span class="pay-sub">Open in Venmo →</span>
      </span>
      <img class="qr" src="qr/venmo.svg" alt="Venmo QR code" width="240" height="240">
    </a>

    <a class="pay cashapp" href="https://cash.app/$BBronosky?qr=1">
      <span class="pay-head">
        <span class="pay-brand">Cash App</span>
        <span class="pay-sub">$BBronosky →</span>
      </span>
      <img class="qr" src="qr/cashapp.svg" alt="Cash App QR code" width="240" height="240">
    </a>
  </div>
</main>
<footer>Thank you for watching.</footer>
</body>
</html>
